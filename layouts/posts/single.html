{{ define "main" }}
<article class="article-page">
  <a class="article-back" href="{{ "posts" | relURL }}">← Voltar aos artigos</a>
  <header class="article-header">
    <p class="article-kicker">ARTIGO</p>
    <h1>{{ .Title }}</h1>
    <div class="article-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time><span>{{ .ReadingTime }} min de leitura</span>{{ with .Params.series }}<a href="{{ (printf "/series/%s/" (index . 0 | urlize)) | relURL }}">Série: {{ index . 0 }}</a>{{ end }}</div>
  </header>
  <div class="article-content">{{ .Content }}</div>
  <footer class="article-footer"><a href="{{ "posts" | relURL }}">← Ver todos os artigos</a><a href="https://www.linkedin.com/in/luiz-schons/">Conecte-se no LinkedIn ↗</a></footer>
</article>
{{ end }}
