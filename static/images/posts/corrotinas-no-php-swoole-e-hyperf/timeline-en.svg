<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Timeline of three requests on PHP-FPM and on Swoole</title>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f8fafc"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e5e7eb" stroke-width="3"/></pattern></defs>
<rect width="820" height="520" fill="#ffffff"/>
<text x="30" y="40" font-size="15" font-weight="700" fill="#111827">PHP-FPM: one process handles one request at a time</text>
<text x="790" y="40" text-anchor="end" font-size="13" font-weight="600" fill="#64748b">3 requests in ~1.8 s</text>
<text x="30" y="77" font-size="13" fill="#111827">Request A</text>
<rect x="190.0" y="62" width="8.0" height="22" rx="3" fill="#2563eb"/>
<rect x="198.0" y="62" width="184.0" height="22" fill="url(#hatch)" stroke="#cbd5e1"/>
<rect x="382.0" y="62" width="8.0" height="22" rx="3" fill="#2563eb"/>
<text x="290.0" y="77" text-anchor="middle" font-size="11" fill="#64748b">waiting on the network</text>
<text x="30" y="113" font-size="13" fill="#111827">Request B</text>
<rect x="190.0" y="99" width="197.0" height="20" rx="3" fill="none" stroke="#cbd5e1" stroke-dasharray="4 3"/>
<text x="290.0" y="113" text-anchor="middle" font-size="11" fill="#64748b">in the queue</text>
<rect x="390.0" y="98" width="8.0" height="22" rx="3" fill="#2563eb"/>
<rect x="398.0" y="98" width="184.0" height="22" fill="url(#hatch)" stroke="#cbd5e1"/>
<rect x="582.0" y="98" width="8.0" height="22" rx="3" fill="#2563eb"/>
<text x="490.0" y="113" text-anchor="middle" font-size="11" fill="#64748b">waiting on the network</text>
<text x="30" y="149" font-size="13" fill="#111827">Request C</text>
<rect x="190.0" y="135" width="397.0" height="20" rx="3" fill="none" stroke="#cbd5e1" stroke-dasharray="4 3"/>
<text x="390.0" y="149" text-anchor="middle" font-size="11" fill="#64748b">in the queue</text>
<rect x="590.0" y="134" width="8.0" height="22" rx="3" fill="#2563eb"/>
<rect x="598.0" y="134" width="184.0" height="22" fill="url(#hatch)" stroke="#cbd5e1"/>
<rect x="782.0" y="134" width="8.0" height="22" rx="3" fill="#2563eb"/>
<text x="690.0" y="149" text-anchor="middle" font-size="11" fill="#64748b">waiting on the network</text>
<line x1="190.0" y1="172" x2="790.0" y2="172" stroke="#cbd5e1"/>
<line x1="190.0" y1="172" x2="190.0" y2="177" stroke="#cbd5e1"/>
<text x="190.0" y="190" text-anchor="middle" font-size="11" fill="#64748b">0 ms</text>
<line x1="390.0" y1="172" x2="390.0" y2="177" stroke="#cbd5e1"/>
<text x="390.0" y="190" text-anchor="middle" font-size="11" fill="#64748b">600 ms</text>
<line x1="590.0" y1="172" x2="590.0" y2="177" stroke="#cbd5e1"/>
<text x="590.0" y="190" text-anchor="middle" font-size="11" fill="#64748b">1200 ms</text>
<line x1="790.0" y1="172" x2="790.0" y2="177" stroke="#cbd5e1"/>
<text x="790.0" y="190" text-anchor="middle" font-size="11" fill="#64748b">1800 ms</text>
<text x="30" y="240" font-size="15" font-weight="700" fill="#111827">Swoole: one worker, one coroutine per request</text>
<text x="790" y="240" text-anchor="end" font-size="13" font-weight="600" fill="#2563eb">3 requests in ~0.6 s</text>
<text x="30" y="277" font-size="13" fill="#111827">Request A</text>
<rect x="190.0" y="262" width="8.0" height="22" rx="3" fill="#2563eb"/>
<rect x="198.0" y="262" width="184.0" height="22" fill="url(#hatch)" stroke="#cbd5e1"/>
<rect x="382.0" y="262" width="8.0" height="22" rx="3" fill="#2563eb"/>
<text x="290.0" y="277" text-anchor="middle" font-size="11" fill="#64748b">waiting on the network</text>
<text x="30" y="313" font-size="13" fill="#111827">Request B</text>
<rect x="198.0" y="298" width="8.0" height="22" rx="3" fill="#2563eb"/>
<rect x="206.0" y="298" width="184.0" height="22" fill="url(#hatch)" stroke="#cbd5e1"/>
<rect x="390.0" y="298" width="8.0" height="22" rx="3" fill="#2563eb"/>
<text x="30" y="349" font-size="13" fill="#111827">Request C</text>
<rect x="206.0" y="334" width="8.0" height="22" rx="3" fill="#2563eb"/>
<rect x="214.0" y="334" width="184.0" height="22" fill="url(#hatch)" stroke="#cbd5e1"/>
<rect x="398.0" y="334" width="8.0" height="22" rx="3" fill="#2563eb"/>
<text x="30" y="393" font-size="13" font-weight="600" fill="#111827">Worker</text>
<rect x="190.0" y="387" width="600.0" height="4" rx="2" fill="#f1f5f9"/>
<rect x="190.0" y="378" width="24.0" height="22" rx="3" fill="#2563eb"/>
<rect x="390.0" y="378" width="24.0" height="22" rx="3" fill="#2563eb"/>
<text x="302.0" y="393" text-anchor="middle" font-size="11" fill="#64748b">free for other requests</text>
<line x1="190.0" y1="412" x2="790.0" y2="412" stroke="#cbd5e1"/>
<line x1="190.0" y1="412" x2="190.0" y2="417" stroke="#cbd5e1"/>
<text x="190.0" y="430" text-anchor="middle" font-size="11" fill="#64748b">0 ms</text>
<line x1="390.0" y1="412" x2="390.0" y2="417" stroke="#cbd5e1"/>
<text x="390.0" y="430" text-anchor="middle" font-size="11" fill="#64748b">600 ms</text>
<line x1="590.0" y1="412" x2="590.0" y2="417" stroke="#cbd5e1"/>
<text x="590.0" y="430" text-anchor="middle" font-size="11" fill="#64748b">1200 ms</text>
<line x1="790.0" y1="412" x2="790.0" y2="417" stroke="#cbd5e1"/>
<text x="790.0" y="430" text-anchor="middle" font-size="11" fill="#64748b">1800 ms</text>
<rect x="30" y="484" width="14" height="14" rx="3" fill="#2563eb"/><text x="50" y="495" font-size="12" fill="#64748b">running code (not to scale)</text>
<rect x="300" y="484" width="14" height="14" fill="url(#hatch)" stroke="#cbd5e1"/><text x="320" y="495" font-size="12" fill="#64748b">waiting on the network</text>
<rect x="500" y="484" width="14" height="14" rx="3" fill="none" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="520" y="495" font-size="12" fill="#64748b">waiting in the queue</text>
</svg>