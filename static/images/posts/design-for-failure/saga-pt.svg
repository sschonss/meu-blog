<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Saga coreografada, com eventos num broker, e saga orquestrada, com um orquestrador central</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="960" height="390" fill="#ffffff"/>
<text x="30" y="38" text-anchor="start" font-size="15" font-weight="700" fill="#111827">Coreografada</text>
<text x="450" y="38" text-anchor="start" font-size="15" font-weight="700" fill="#111827">Orquestrada</text>
<rect x="140" y="60" width="170" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="225.0" y="87.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Broker (Kafka, RabbitMQ)</text>
<rect x="30" y="190" width="88" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="74.0" y="217.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">E-commerce</text>
<line x1="74" y1="188" x2="74" y2="148" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
<rect x="130" y="190" width="88" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="174.0" y="217.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Estoque</text>
<line x1="174" y1="188" x2="174" y2="148" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
<rect x="230" y="190" width="88" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="274.0" y="217.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Pagamento</text>
<line x1="274" y1="188" x2="274" y2="148" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
<rect x="330" y="190" width="88" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="374.0" y="217.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Frete</text>
<line x1="374" y1="188" x2="374" y2="148" stroke="#2563eb" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
<line x1="74" y1="148" x2="374" y2="148" stroke="#2563eb" stroke-width="1.5"/><line x1="225" y1="148" x2="225" y2="106" stroke="#2563eb" stroke-width="1.5"/>
<text x="30" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">Cada serviço reage a eventos</text>
<text x="30" y="318" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">e publica os seus, inclusive de compensação</text>
<text x="30" y="336" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">Sem ponto central, consistência eventual</text>
<rect x="450" y="190" width="100" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="500.0" y="217.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">E-commerce</text>
<line x1="552" y1="212" x2="598" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="180" width="130" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="665.0" y="217.0" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Orquestrador</text>
<rect x="830" y="60" width="100" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="880.0" y="87.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Estoque</text>
<rect x="830" y="190" width="100" height="44" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="880.0" y="217.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Pagamento</text>
<rect x="830" y="320" width="100" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="880.0" y="340.0" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Frete</text>
<text x="880.0" y="357.0" text-anchor="middle" font-size="11" fill="#64748b">falhou</text>
<path d="M732,195 L828,82" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M732,214 L828,214" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M732,229 L828,342" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M700,178 C700,120 760,92 828,92" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M732,202 L828,202" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="650" y="130" text-anchor="end" font-size="11" font-weight="400" fill="#dc2626">compensações</text>
<text x="450" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">O orquestrador chama cada serviço</text>
<text x="450" y="318" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">e dispara as compensações se algo falha</text>
<text x="450" y="336" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">Fluxo num lugar só, mas ele vira dependência</text>
</svg>
