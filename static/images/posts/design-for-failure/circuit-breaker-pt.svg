<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Os três estados de um circuit breaker e as transições entre eles</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="860" height="430" fill="#ffffff"/>
<rect x="60" y="150" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="160.0" y="183.0" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">CLOSED</text>
<text x="160.0" y="200.0" text-anchor="middle" font-size="11" fill="#64748b">chamadas passam</text>
<rect x="580" y="150" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="690.0" y="183.0" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">OPEN</text>
<text x="690.0" y="200.0" text-anchor="middle" font-size="11" fill="#64748b">chamadas vão direto pro fallback</text>
<rect x="330" y="330" width="200" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="430.0" y="363.0" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">HALF-OPEN</text>
<text x="430.0" y="380.0" text-anchor="middle" font-size="11" fill="#64748b">uma chamada de teste passa</text>
<line x1="262" y1="170" x2="578" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="420" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">falhas chegam ao limite</text>
<path d="M690,222 C690,330 600,365 532,365" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="690" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">passou o tempo de espera</text>
<path d="M328,365 C220,365 160,300 160,222" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="160" y="300" text-anchor="end" font-size="12" font-weight="400" fill="#64748b">teste deu certo</text>
<path d="M470,328 C520,280 600,250 640,224" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="500" y="272" text-anchor="end" font-size="12" font-weight="400" fill="#64748b">teste falhou</text>
<path d="M120,148 C100,90 220,90 200,148" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="160" y="82" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">sucesso zera o contador</text>
</svg>
