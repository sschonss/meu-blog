<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>An online store split into services, with the shipping service down</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="860" height="320" fill="#ffffff"/>
<text x="30" y="38" text-anchor="start" font-size="15" font-weight="700" fill="#111827">One purchase goes through four services</text>
<circle cx="70" cy="156" r="10" fill="none" stroke="#111827" stroke-width="1.5"/><path d="M53,192 Q53,170 70,170 Q87,170 87,192 z" fill="none" stroke="#111827" stroke-width="1.5"/>
<text x="70" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Customer</text>
<line x1="100" y1="170" x2="198" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="140" width="140" height="60" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="270.0" y="175.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">E-commerce</text>
<rect x="470" y="60" width="140" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="540.0" y="93.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Stock</text>
<rect x="470" y="152" width="140" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="540.0" y="178.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Shipping</text>
<text x="540.0" y="195.0" text-anchor="middle" font-size="11" fill="#64748b">down</text>
<rect x="470" y="244" width="140" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="540.0" y="277.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Payment</text>
<path d="M340,160 L400,160 L400,88 L468,88" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340,170 L468,180" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M340,180 L400,180 L400,272 L468,272" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M421,166 L439,184 M439,166 L421,184" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
<text x="640" y="185" text-anchor="start" font-size="13" font-weight="600" fill="#dc2626">Now what, does the whole order fail?</text>
</svg>
