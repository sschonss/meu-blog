<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Sinalização passo a passo: os dois deixam um aviso no mural da sala, trocam oferta, resposta e candidatos ICE pelas caixas de recado (tudo cifrado com o código da sala), o ICE testa os caminhos e o canal WebRTC abre. Dali em diante o jogo não passa pelo mural</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<rect x="30" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="140.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Anfitrião</text>
<text x="140.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">criou a sala</text>
<line x1="140" y1="78" x2="140" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="370" y="20" width="220" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="480.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Mural</text>
<text x="480.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">relays Nostr e brokers MQTT</text>
<line x1="480" y1="78" x2="480" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="710" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="820.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Convidado</text>
<text x="820.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">abriu o convite</text>
<line x1="820" y1="78" x2="820" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="20" y="88" width="920" height="26" rx="6" fill="#f8fafc"/>
<text x="480" y="106" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">mural = nome derivado do código da sala; cada um também tem a própria caixa de recado</text>
<line x1="144" y1="146" x2="476" y2="146" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="154" y="122" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">1 · “estou aqui” no mural da sala</text>
<line x1="816" y1="190" x2="484" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="494" y="166" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">2 · “estou aqui” no mural da sala</text>
<line x1="476" y1="234" x2="144" y2="234" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="154" y="210" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">3 · o mural mostra o aviso do convidado</text>
<line x1="144" y1="278" x2="476" y2="278" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="154" y="254" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">4 · oferta (SDP, cifrada) na caixa do convidado</text>
<line x1="484" y1="322" x2="816" y2="322" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="494" y="298" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">5 · entrega a oferta</text>
<line x1="816" y1="366" x2="484" y2="366" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="494" y="342" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="356" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">6 · resposta (SDP, cifrada) na caixa do anfitrião</text>
<line x1="476" y1="410" x2="144" y2="410" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="154" y="386" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">7 · entrega a resposta</text>
<line x1="144" y1="446" x2="476" y2="446" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="484" y1="446" x2="816" y2="446" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="300" y="422" width="360" height="18" fill="#ffffff"/>
<text x="480" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">8 · candidatos ICE (cifrados), nos dois sentidos</text>
<rect x="20" y="466" width="920" height="26" rx="6" fill="#f0fdf4"/>
<text x="480" y="484" text-anchor="middle" font-size="12" font-weight="400" fill="#166534">o mural sai de cena: ele nunca carrega uma jogada</text>
<rect x="160" y="512" width="640" height="18" fill="#ffffff"/>
<text x="480" y="526" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">9 · ICE testa os pares de endereços: canal WebRTC aberto (DTLS)</text>
<line x1="144" y1="540" x2="816" y2="540" stroke="#16a34a" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<rect x="250" y="566" width="460" height="18" fill="#ffffff"/>
<text x="480" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">10 · o jogo segue direto: act, state, ack, tick</text>
<line x1="144" y1="594" x2="816" y2="594" stroke="#16a34a" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
</svg>