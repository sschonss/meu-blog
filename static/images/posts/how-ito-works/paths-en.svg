<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two possible paths. On the left, the direct one: after STUN, both phones send packets to each other at the same time and the NATs let them through. On the right, when the direct path fails, both talk to a TURN server, which relays the encrypted bytes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="420" fill="#ffffff"/>
<rect x="20" y="20" width="440" height="290" rx="10" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="240" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Direct path (when possible)</text>
<rect x="500" y="20" width="440" height="290" rx="10" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="720" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Through TURN (when direct fails)</text>
<rect x="40" y="70" width="130" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="105.0" y="91.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Phone A</text>
<text x="105.0" y="109.5" text-anchor="middle" font-size="12" fill="#475569">home Wi-Fi</text>
<rect x="290" y="70" width="130" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="355.0" y="91.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Phone B</text>
<text x="355.0" y="109.5" text-anchor="middle" font-size="12" fill="#475569">4G</text>
<rect x="65" y="170" width="80" height="36" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="105.0" y="192.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">NAT</text>
<rect x="315" y="170" width="80" height="36" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="355.0" y="192.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">CGNAT</text>
<line x1="105" y1="124" x2="105" y2="168" stroke="#2563eb" stroke-width="2.5"/>
<line x1="355" y1="124" x2="355" y2="168" stroke="#2563eb" stroke-width="2.5"/>
<path d="M105,208 L105,240 L355,240 L355,208" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<path d="M105,208 L105,240 L355,240 L355,208" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="230" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">both “knock on the door”</text>
<text x="230" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">at the same time, using the</text>
<text x="230" y="296" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">addresses found via STUN</text>
<rect x="520" y="70" width="130" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="585.0" y="91.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Phone A</text>
<text x="585.0" y="109.5" text-anchor="middle" font-size="12" fill="#475569">home Wi-Fi</text>
<rect x="790" y="70" width="130" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="855.0" y="91.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Phone B</text>
<text x="855.0" y="109.5" text-anchor="middle" font-size="12" fill="#475569">4G</text>
<rect x="545" y="170" width="80" height="36" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="585.0" y="192.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">NAT</text>
<rect x="815" y="170" width="80" height="36" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="855.0" y="192.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">CGNAT</text>
<line x1="585" y1="124" x2="585" y2="168" stroke="#2563eb" stroke-width="2.5"/>
<line x1="855" y1="124" x2="855" y2="168" stroke="#2563eb" stroke-width="2.5"/>
<rect x="645" y="220" width="150" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="720.0" y="241.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">TURN server</text>
<text x="720.0" y="259.5" text-anchor="middle" font-size="12" fill="#475569">Cloudflare Realtime</text>
<path d="M585,208 L585,246 L643,246 M855,208 L855,246 L797,246" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text x="720" y="290" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">each one connects outward,</text>
<text x="720" y="304" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">TURN relays between them</text>
<rect x="20" y="330" width="440" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="240.0" y="351.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">When direct fails</text>
<text x="240.0" y="369.5" text-anchor="middle" font-size="12" fill="#475569">symmetric NAT, a corporate network</text>
<text x="240.0" y="387.5" text-anchor="middle" font-size="12" fill="#475569">blocking UDP, carrier CGNAT</text>
<rect x="500" y="330" width="440" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="720.0" y="360.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Either way: DTLS end to end</text>
<text x="720.0" y="378.5" text-anchor="middle" font-size="12" fill="#475569">TURN sees encrypted bytes, not the moves</text>
</svg>