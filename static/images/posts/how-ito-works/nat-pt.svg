<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>NAT: em casa, o roteador mostra um endereço só para a internet (203.0.113.5) e esconde os aparelhos de dentro (192.168.0.x). No 4G, a operadora faz o mesmo em escala (CGNAT). Nenhum dos dois aceita uma conexão que chega de fora sem ter sido pedida</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="440" fill="#ffffff"/>
<rect x="20" y="20" width="300" height="330" rx="10" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<rect x="640" y="20" width="300" height="330" rx="10" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="36" y="44" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Rede de casa (Wi-Fi)</text>
<text x="924" y="44" text-anchor="end" font-size="13" font-weight="700" fill="#111827">Rede móvel (4G/5G)</text>
<rect x="40" y="64" width="120" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="100.0" y="85.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Celular</text>
<text x="100.0" y="103.5" text-anchor="middle" font-size="12" fill="#475569">192.168.0.10</text>
<rect x="180" y="64" width="120" height="52" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="240.0" y="85.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Notebook</text>
<text x="240.0" y="103.5" text-anchor="middle" font-size="12" fill="#475569">192.168.0.11</text>
<text x="170" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">vários apartamentos</text>
<line x1="100" y1="118" x2="150" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="240" y1="118" x2="190" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="198" width="220" height="72" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="170.0" y="220.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Roteador (NAT)</text>
<text x="170.0" y="238.5" text-anchor="middle" font-size="12" fill="#475569">fora: 203.0.113.5</text>
<text x="170.0" y="256.5" text-anchor="middle" font-size="12" fill="#475569">dentro: 192.168.0.1</text>
<text x="120" y="292" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">um endereço de prédio</text>
<rect x="700" y="64" width="180" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="790.0" y="85.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Celular no 4G</text>
<text x="790.0" y="103.5" text-anchor="middle" font-size="12" fill="#475569">100.64.12.7</text>
<line x1="790" y1="118" x2="790" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="680" y="198" width="220" height="72" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="790.0" y="220.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">CGNAT da operadora</text>
<text x="790.0" y="238.5" text-anchor="middle" font-size="12" fill="#475569">fora: 198.51.100.20</text>
<text x="790.0" y="256.5" text-anchor="middle" font-size="12" fill="#475569">milhares de clientes atrás</text>
<rect x="380" y="198" width="200" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="480.0" y="229.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Internet</text>
<text x="480.0" y="247.5" text-anchor="middle" font-size="12" fill="#475569">só vê os endereços de fora</text>
<line x1="282" y1="234" x2="378" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="678" y1="234" x2="582" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M760,272 L760,330 L230,330 L230,274" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="466" y="318" width="28" height="24" fill="#ffffff"/>
<g stroke="#dc2626" stroke-width="2.5"><line x1="471" y1="321" x2="489" y2="339"/><line x1="489" y1="321" x2="471" y2="339"/></g>
<text x="480" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">o celular do 4G tenta entrar direto: chegou de fora sem pedido, a porta não abre</text>
<text x="480" y="416" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">Endereços de exemplo, de faixas reservadas para documentação (e 100.64.x.x, a faixa usada por CGNAT).</text>
</svg>