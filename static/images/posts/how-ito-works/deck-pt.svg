<text x="480.0" y="205.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Celular B</text>
<text x="480.0" y="223.5" text-anchor="middle" font-size="12" fill="#475569">mesmo baralho</text>
<rect x="660" y="180" width="240" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="780.0" y="205.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Celular C</text>
<text x="780.0" y="223.5" text-anchor="middle" font-size="12" fill="#475569">mesmo baralho</text>
<line x1="180" y1="242" x2="180" y2="296" stroke="#16a34a" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="480" y1="242" x2="480" y2="296" stroke="#16a34a" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="780" y1="242" x2="780" y2="296" stroke="#16a34a" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
<rect x="60" y="298" width="840" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="480.0" y="322.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Pela rede vão só decisões</text>
<text x="480.0" y="340.5" text-anchor="middle" font-size="12" fill="#475569">baixar a carta · arrumar a ordem · votos · dicas</text>
<text x="60" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">As cartas nunca trafegam: cada celular calcula o baralho sozinho, a partir do código da sala.</text>
</svg>