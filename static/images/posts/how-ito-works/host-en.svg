<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The host is the source of truth: the guest asks for an action (act); the host applies it, bumps the version, signs and sends the state; the guest checks the signature and confirms (ack). Every 2 seconds, a tick with version and hash; anyone out of sync asks for the state again (pull)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<rect x="140" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="250.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Guest</text>
<text x="250.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">only asks and checks</text>
<line x1="250" y1="78" x2="250" y2="480" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="600" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="710.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Host</text>
<text x="710.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">the only one who changes state</text>
<line x1="710" y1="78" x2="710" y2="480" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="254" y1="120" x2="706" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="264" y="96" width="432" height="18" fill="#ffffff"/>
<text x="480.0" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">1 · act: “I played my card”</text>
<rect x="760" y="136" width="190" height="70" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="855.0" y="157.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">2 · applies the rule</text>
<text x="855.0" y="175.5" text-anchor="middle" font-size="12" fill="#475569">ver 7 → 8, signs with</text>
<text x="855.0" y="193.5" text-anchor="middle" font-size="12" fill="#475569">the private key</text>
<line x1="706" y1="230" x2="254" y2="230" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="264" y="206" width="432" height="18" fill="#ffffff"/>
<text x="480.0" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">3 · state (ver 8) + signature</text>
<rect x="10" y="246" width="220" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="120.0" y="267.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">4 · checks the signature</text>
<text x="120.0" y="285.5" text-anchor="middle" font-size="12" fill="#475569">with the public key pinned</text>
<text x="120.0" y="303.5" text-anchor="middle" font-size="12" fill="#475569">by the invite link fingerprint</text>
<line x1="254" y1="300" x2="706" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="264" y="276" width="432" height="18" fill="#ffffff"/>
<text x="480.0" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">5 · ack (ver 8, hash)</text>
<line x1="706" y1="360" x2="254" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="264" y="336" width="432" height="18" fill="#ffffff"/>
<text x="480.0" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">6 · tick (ver 8, hash) every 2 s</text>
<line x1="254" y1="405" x2="706" y2="405" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="264" y="381" width="432" height="18" fill="#ffffff"/>
<text x="480.0" y="395" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">7 · pull: “my hash doesn't match, send it again”</text>
<line x1="706" y1="450" x2="254" y2="450" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="264" y="426" width="432" height="18" fill="#ffffff"/>
<text x="480.0" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">8 · state (ver 8) + signature</text>
<text x="480" y="506" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">state without a valid signature, or with an old version: dropped</text>
</svg>