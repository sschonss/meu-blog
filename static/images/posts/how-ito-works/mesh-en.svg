<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Ito's mesh with three phones. João is the host, Maria has a direct channel to both João and Pedro, and Pedro has no direct channel to João. The state signed by João reaches Pedro forwarded by Maria, and only newer versions are forwarded. Pedro's hint, signed by him and carrying an id, goes back to João the same way. Maria only forwards and cannot change anything</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
<rect x="30" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="140.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">João</text>
<text x="140.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">host, signs the state</text>
<line x1="140" y1="78" x2="140" y2="516" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="370" y="20" width="220" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="480.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Maria</text>
<text x="480.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">channel to João and Pedro</text>
<line x1="480" y1="78" x2="480" y2="516" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="710" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="820.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Pedro</text>
<text x="820.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">no direct channel to João</text>
<line x1="820" y1="78" x2="820" y2="516" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="20" y="88" width="920" height="26" rx="6" fill="#f8fafc"/>
<text x="480" y="106" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">WebRTC channels: João ↔ Maria and Maria ↔ Pedro. Between João and Pedro, none</text>
<line x1="144" y1="150" x2="476" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="154" y="126" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">1 · state (ver 12), signed by João</text>
<text x="310.0" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Maria: signature ok, 12 &gt; 11, accepted</text>
<line x1="484" y1="212" x2="816" y2="212" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="494" y="188" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">2 · forwards the same packet, signed</text>
<text x="650.0" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Pedro checks João's signature and accepts</text>
<line x1="144" y1="274" x2="476" y2="274" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="154" y="250" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">3 · ver 12 arrives again (via the other network)</text>
<text x="310.0" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">not greater than 12: Maria drops it, no forwarding</text>
<line x1="816" y1="336" x2="484" y2="336" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="494" y="312" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">4 · act: Pedro's hint, signed by him</text>
<text x="650.0" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">carries an id (p7k2) so it never counts twice</text>
<line x1="476" y1="398" x2="144" y2="398" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="154" y="374" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="388" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">5 · forwards the act untouched</text>
<text x="310.0" y="414" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">João checks it, applies it once: ver 12 → 13</text>
<line x1="144" y1="460" x2="476" y2="460" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="154" y="436" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">6 · state (ver 13), signed</text>
<line x1="484" y1="460" x2="816" y2="460" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="494" y="436" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">7 · forwards ver 13</text>
<rect x="20" y="484" width="920" height="26" rx="6" fill="#f8fafc"/>
<text x="480" y="502" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">on Pedro's screen: “connected via Maria”</text>
<rect x="20" y="528" width="920" height="26" rx="6" fill="#f0fdf4"/>
<text x="480" y="546" text-anchor="middle" font-size="12" font-weight="400" fill="#166534">whoever is in the middle only forwards: state and actions are signed, so Maria cannot change anything</text>
<text x="480" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">limit: if Pedro has no channel to anyone in the room, there is no path to forward through. That is TURN's job</text>
</svg>