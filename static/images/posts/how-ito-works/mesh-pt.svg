<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Malha do Ito com três celulares. João é o anfitrião, Maria tem canal direto com João e com Pedro, e Pedro não tem canal direto com João. O estado assinado por João chega a Pedro repassado por Maria, e só versões mais novas são repassadas. A dica de Pedro, assinada por ele e com um id, volta a João pelo mesmo caminho. Maria só repassa, não consegue alterar nada</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
<rect x="30" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="140.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">João</text>
<text x="140.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">anfitrião, assina o estado</text>
<line x1="140" y1="78" x2="140" y2="516" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="370" y="20" width="220" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="480.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Maria</text>
<text x="480.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">canal com João e com Pedro</text>
<line x1="480" y1="78" x2="480" y2="516" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="710" y="20" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="820.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Pedro</text>
<text x="820.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">sem canal direto com João</text>
<line x1="820" y1="78" x2="820" y2="516" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="20" y="88" width="920" height="26" rx="6" fill="#f8fafc"/>
<text x="480" y="106" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">canais WebRTC: João ↔ Maria e Maria ↔ Pedro. Entre João e Pedro, nenhum</text>
<line x1="144" y1="150" x2="476" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="154" y="126" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">1 · state (ver 12), assinado por João</text>
<text x="310.0" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Maria: assinatura ok, 12 &gt; 11, aceita</text>
<line x1="484" y1="212" x2="816" y2="212" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="494" y="188" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">2 · repassa o mesmo pacote, assinado</text>
<text x="650.0" y="228" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">Pedro confere a assinatura de João e aceita</text>
<line x1="144" y1="274" x2="476" y2="274" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="154" y="250" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">3 · a ver 12 chega de novo (pela outra rede)</text>
<text x="310.0" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">não é maior que 12: Maria descarta e não repassa</text>
<line x1="816" y1="336" x2="484" y2="336" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="494" y="312" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">4 · act: dica de Pedro, assinada por ele</text>
<text x="650.0" y="352" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">leva um id (p7k2) para não contar duas vezes</text>
<line x1="476" y1="398" x2="144" y2="398" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="154" y="374" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="388" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">5 · repassa o act intacto</text>
<text x="310.0" y="414" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">João confere, aplica uma vez: ver 12 → 13</text>
<line x1="144" y1="460" x2="476" y2="460" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="154" y="436" width="312" height="18" fill="#ffffff"/>
<text x="310.0" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">6 · state (ver 13), assinado</text>
<line x1="484" y1="460" x2="816" y2="460" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="494" y="436" width="312" height="18" fill="#ffffff"/>
<text x="650.0" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">7 · repassa a ver 13</text>
<rect x="20" y="484" width="920" height="26" rx="6" fill="#f8fafc"/>
<text x="480" y="502" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">na tela de Pedro: “conectado via Maria”</text>
<rect x="20" y="528" width="920" height="26" rx="6" fill="#f0fdf4"/>
<text x="480" y="546" text-anchor="middle" font-size="12" font-weight="400" fill="#166534">quem está no meio só repassa: estado e ação vão assinados, então Maria não consegue mudar nada</text>
<text x="480" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">limite: se Pedro não tiver canal com ninguém da sala, não há por onde repassar. Aí quem resolve é o TURN</text>
</svg>