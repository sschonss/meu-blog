<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui,sans-serif" role="img"><title>Diagram: an agent asks the shared memory. For an operational question, like how to find the log of a transaction in QA or production, the memory answers directly. For a complex question, like how to test a credit card transaction in QA, the memory returns the link to the documentation, which holds the full procedure.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Documentation and memory, together</text><rect x="20" y="170" width="160" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="100.0" y="211.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">agent</text><text x="100.0" y="233.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">in any editor</text><rect x="270" y="160" width="230" height="110" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="201.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">shared memory</text><text x="385.0" y="223.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">short answers</text><text x="385.0" y="242.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">and links to docs</text><rect x="640" y="60" width="240" height="100" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="760.0" y="96.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">direct answer</text><text x="760.0" y="118.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">how to find the log of a</text><text x="760.0" y="137.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">transaction in QA or production</text><rect x="640" y="270" width="240" height="100" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="760.0" y="306.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">documentation</text><text x="760.0" y="328.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">how to test a credit card</text><text x="760.0" y="347.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">transaction in QA (full procedure)</text><line x1="180" y1="215" x2="264" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="222" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">asks</text><line x1="500" y1="190" x2="634" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="186" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">operational:</text><text x="560" y="203" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">answers</text><line x1="500" y1="240" x2="634" y2="315" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="240" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">complex:</text><text x="560" y="257" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">returns the link</text><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">Short, day-to-day answers live in the memory.</text><text x="450" y="421" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">Long procedures live in the docs, and the memory points to them.</text></svg>