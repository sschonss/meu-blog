<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui,sans-serif" role="img"><title>Diagrama: à esquerda, hoje, três devs ensinam cada um o seu agente (Cursor, OpenCode, Claude Code) e cada agente guarda as próprias anotações de como buscar logs. À direita, os três agentes leem e gravam numa memória compartilhada com os fluxos do time.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Quem ensina o agente?</text><text x="225" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Hoje: cada agente aprende sozinho</text><text x="675" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Com uma memória compartilhada</text><line x1="450" y1="60" x2="450" y2="390" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30" y="96" width="150" height="64" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="105.0" y="134.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Cursor</text><rect x="245" y="92" width="192" height="72" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="341.0" y="114.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">anotações próprias</text><text x="341.0" y="136.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como buscar logs</text><text x="341.0" y="155.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">(ensinado de novo)</text><line x1="180" y1="128" x2="239" y2="128" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><rect x="475" y="96" width="150" height="64" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="550.0" y="134.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Cursor</text><line x1="625" y1="128" x2="712" y2="140" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="191" width="150" height="64" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="105.0" y="229.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OpenCode</text><rect x="245" y="187" width="192" height="72" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="341.0" y="209.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">anotações próprias</text><text x="341.0" y="231.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como buscar logs</text><text x="341.0" y="250.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">(ensinado de novo)</text><line x1="180" y1="223" x2="239" y2="223" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><rect x="475" y="191" width="150" height="64" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="550.0" y="229.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OpenCode</text><line x1="625" y1="223" x2="712" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="286" width="150" height="64" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="105.0" y="324.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Claude Code</text><rect x="245" y="282" width="192" height="72" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="341.0" y="304.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">anotações próprias</text><text x="341.0" y="326.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como buscar logs</text><text x="341.0" y="345.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">(ensinado de novo)</text><line x1="180" y1="318" x2="239" y2="318" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><rect x="475" y="286" width="150" height="64" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="550.0" y="324.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Claude Code</text><line x1="625" y1="318" x2="712" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><rect x="718" y="128" width="165" height="132" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="800.5" y="170.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">memória do time</text><text x="800.5" y="192.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como buscar logs</text><text x="800.5" y="211.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como fazer deploy</text><text x="800.5" y="230.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">quem está de plantão</text><text x="800" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">lê e grava</text><text x="225" y="405" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">A mesma lição, ensinada uma vez por pessoa.</text><text x="675" y="405" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">Ensinada uma vez, lida por todo agente.</text></svg>