<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui,sans-serif" role="img"><title>Diagram of the first test: in Cursor, the user states the deploy window and Cursor writes it to the shared memory. In OpenCode, the user asks what the deploy window is, OpenCode reads the memory and answers with the same text.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="320" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Test 1: a fact written in one editor, read in the other</text><rect x="20" y="80" width="220" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="130.0" y="121.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Cursor</text><text x="130.0" y="143.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;the deploy window is</text><text x="130.0" y="162.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">now Mon to Fri, 8am to 2pm&quot;</text><rect x="340" y="80" width="220" height="110" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="450.0" y="121.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Loom</text><text x="450.0" y="143.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">deploy window:</text><text x="450.0" y="162.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">Mon to Fri, 8am to 2pm</text><rect x="660" y="80" width="220" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="770.0" y="121.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OpenCode</text><text x="770.0" y="143.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;what is the</text><text x="770.0" y="162.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">deploy window?&quot;</text><line x1="240" y1="135" x2="334" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="287" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">1. writes</text><line x1="560" y1="135" x2="654" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="607" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">2. reads</text><text x="770" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">same answer:</text><text x="770" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Mon to Fri, 8am to 2pm</text><text x="450" y="290" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">OpenCode was opened in an unrelated folder and still found the answer.</text></svg>