<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui,sans-serif" role="img"><title>Diagrama: um agente consulta a memória compartilhada. Para uma pergunta operacional, como buscar o log de uma transação em QA ou em produção, a memória responde direto. Para uma pergunta complexa, como testar uma transação com cartão de crédito em QA, a memória devolve o link da documentação, que tem o procedimento completo.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Documentação e memória, juntas</text><rect x="20" y="170" width="160" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="100.0" y="211.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">agente</text><text x="100.0" y="233.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">em qualquer editor</text><rect x="270" y="160" width="230" height="110" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="385.0" y="201.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">memória compartilhada</text><text x="385.0" y="223.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">respostas curtas</text><text x="385.0" y="242.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">e links para a documentação</text><rect x="640" y="60" width="240" height="100" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="760.0" y="96.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">resposta direta</text><text x="760.0" y="118.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como buscar o log de uma</text><text x="760.0" y="137.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">transação em QA ou produção</text><rect x="640" y="270" width="240" height="100" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="760.0" y="306.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">documentação</text><text x="760.0" y="328.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">como testar uma transação com</text><text x="760.0" y="347.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">cartão de crédito em QA</text><line x1="180" y1="215" x2="264" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="222" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">pergunta</text><line x1="500" y1="190" x2="634" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="186" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">operacional:</text><text x="560" y="203" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">responde</text><line x1="500" y1="240" x2="634" y2="315" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="240" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">complexa:</text><text x="560" y="257" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">devolve o link</text><text x="450" y="400" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">Respostas curtas do dia a dia ficam na memória.</text><text x="450" y="421" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">Procedimentos longos ficam na documentação, e a memória aponta para ela.</text></svg>