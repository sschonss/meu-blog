<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui,sans-serif" role="img"><title>Diagrama do primeiro teste: no Cursor, a pessoa informa a janela de deploy e o Cursor grava na memória compartilhada. No OpenCode, a pessoa pergunta qual é a janela de deploy, o OpenCode lê a memória e responde com o mesmo texto.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="320" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Teste 1: um fato gravado num editor, lido no outro</text><rect x="20" y="80" width="220" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="130.0" y="121.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Cursor</text><text x="130.0" y="143.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;a janela de deploy agora</text><text x="130.0" y="162.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">é seg a sex, das 8h às 14h&quot;</text><rect x="340" y="80" width="220" height="110" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="450.0" y="121.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Loom</text><text x="450.0" y="143.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">janela de deploy:</text><text x="450.0" y="162.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">seg a sex, das 8h às 14h</text><rect x="660" y="80" width="220" height="110" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="770.0" y="121.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OpenCode</text><text x="770.0" y="143.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;qual é a</text><text x="770.0" y="162.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">janela de deploy?&quot;</text><line x1="240" y1="135" x2="334" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="287" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">1. grava</text><line x1="560" y1="135" x2="654" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="607" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">2. lê</text><text x="770" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">mesma resposta:</text><text x="770" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">seg a sex, das 8h às 14h</text><text x="450" y="290" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">O OpenCode foi aberto numa pasta qualquer e mesmo assim achou a resposta.</text></svg>