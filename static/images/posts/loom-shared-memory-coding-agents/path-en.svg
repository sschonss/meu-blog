<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,sans-serif" role="img"><title>Diagram of the second test: OpenCode writes to the shared memory only the procedure, ask the on-call service. In Cursor, the user asks who is on call. Cursor reads the procedure from memory, calls the on-call service through a small connector, and the service returns the name of the person on call today.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Test 2: the memory stores the path, not the value</text><rect x="20" y="70" width="180" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="110.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OpenCode</text><text x="110.0" y="123.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;note how to find</text><text x="110.0" y="142.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">who is on call&quot;</text><rect x="410" y="70" width="250" height="90" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="535.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Loom</text><text x="535.0" y="123.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">procedure: do not guess,</text><text x="535.0" y="142.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">ask the on-call service</text><rect x="20" y="270" width="180" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="110.0" y="301.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Cursor</text><text x="110.0" y="323.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;who is on call</text><text x="110.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">today?&quot;</text><rect x="370" y="270" width="180" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/><text x="460.0" y="301.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">connector</text><text x="460.0" y="323.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">only fetches</text><text x="460.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">the value</text><rect x="680" y="270" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="780.0" y="301.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">on-call service</text><text x="780.0" y="323.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">a mock standing in</text><text x="780.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">for the real system</text><line x1="200" y1="115" x2="404" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="302" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">1. writes the procedure</text><line x1="150" y1="270" x2="500" y2="166" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="330" y="248" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">2. reads the path</text><line x1="200" y1="300" x2="364" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="282" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">3. asks</text><line x1="550" y1="300" x2="674" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><path d="M780,360 L780,395 L120,395 L120,366" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">4. returns today&#x27;s name</text><text x="450" y="452" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">No name is stored in the memory. It always comes fresh from the service.</text></svg>