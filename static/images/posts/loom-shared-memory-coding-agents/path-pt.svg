<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,sans-serif" role="img"><title>Diagrama do segundo teste: o OpenCode grava na memória compartilhada só o procedimento, pergunte ao serviço de plantão. No Cursor, a pessoa pergunta quem está de plantão. O Cursor lê o procedimento na memória, chama o serviço de plantão por um conector pequeno, e o serviço devolve o nome de quem está de plantão hoje.</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="470" fill="#ffffff"/><text x="20" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">Teste 2: a memória guarda o caminho, não o valor</text><rect x="20" y="70" width="180" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="110.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">OpenCode</text><text x="110.0" y="123.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;anota como descobrir</text><text x="110.0" y="142.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">quem está de plantão&quot;</text><rect x="410" y="70" width="250" height="90" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="535.0" y="101.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Loom</text><text x="535.0" y="123.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">procedimento: não chute,</text><text x="535.0" y="142.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">pergunte ao serviço de plantão</text><rect x="20" y="270" width="180" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="110.0" y="301.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Cursor</text><text x="110.0" y="323.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">&quot;quem é o plantonista</text><text x="110.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">hoje?&quot;</text><rect x="370" y="270" width="180" height="90" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/><text x="460.0" y="301.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">conector</text><text x="460.0" y="323.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">só busca</text><text x="460.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">o valor</text><rect x="680" y="270" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="780.0" y="301.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">serviço de plantão</text><text x="780.0" y="323.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">um mock no lugar</text><text x="780.0" y="342.0" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">do sistema real</text><line x1="200" y1="115" x2="404" y2="115" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="302" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">1. grava o procedimento</text><line x1="150" y1="270" x2="500" y2="166" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="330" y="248" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">2. lê o caminho</text><line x1="200" y1="300" x2="364" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="282" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">3. pergunta</text><line x1="550" y1="300" x2="674" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><path d="M780,360 L780,395 L120,395 L120,366" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">4. devolve o nome de hoje</text><text x="450" y="452" text-anchor="middle" font-size="14" font-weight="400" fill="#334155">Nenhum nome fica na memória. Ele sempre vem atualizado do serviço.</text></svg>