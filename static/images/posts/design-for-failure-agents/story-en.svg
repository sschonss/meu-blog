<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Fictional order 1842: the summary the assistant read does not match the payment</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="920" height="430" fill="#ffffff"/>
<text x="32" y="36" font-size="15" font-weight="700" fill="#111827">Order 1842 is fictional. The two pictures disagree.</text>
<rect x="32" y="58" width="410" height="268" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="52" y="92" font-size="14" font-weight="700" fill="#111827">What the assistant read</text>
<text x="52" y="114" font-size="12" fill="#64748b">order summary taken at 10:02</text>
<text x="52" y="162" font-size="16" font-weight="600" fill="#111827">Order 1842</text>
<text x="52" y="194" font-size="15" fill="#111827">One charge of R$120</text>
<text x="52" y="226" font-size="15" fill="#111827">Refund: none</text>
<text x="52" y="286" font-size="13" fill="#92400e">The assistant proposes another refund.</text>
<rect x="478" y="58" width="410" height="268" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="498" y="92" font-size="14" font-weight="700" fill="#111827">What payment knows at 10:04</text>
<text x="498" y="114" font-size="12" fill="#64748b">the assistant did not ask again</text>
<text x="498" y="162" font-size="16" font-weight="600" fill="#111827">Order 1842</text>
<text x="498" y="194" font-size="15" fill="#111827">One charge of R$120</text>
<text x="498" y="226" font-size="15" fill="#111827">Refund of R$120, processing</text>
<text x="498" y="286" font-size="13" fill="#166534">Another proposal must be blocked.</text>
<text x="32" y="368" font-size="13" fill="#64748b">Illustrative amounts and times (BRT). Queries can still return HTTP 200.</text>
<text x="32" y="398" font-size="13" font-weight="600" fill="#dc2626">A new refund is a new business operation, not a retry of the read.</text>
</svg>
