<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Recorded, unknown and known outcomes for one refund</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="32" y="40" font-size="15" font-weight="700" fill="#111827">A lost response is not a rejected refund</text>
<rect x="32" y="120" width="240" height="96" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="152" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">RECORDED</text>
<text x="152" y="182" text-anchor="middle" font-size="12" fill="#64748b">intent and key persisted</text>
<rect x="330" y="120" width="240" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="450" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">UNKNOWN</text>
<text x="450" y="182" text-anchor="middle" font-size="12" fill="#64748b">no confirmed local outcome</text>
<rect x="628" y="120" width="240" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="748" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">KNOWN</text>
<text x="748" y="182" text-anchor="middle" font-size="12" fill="#64748b">success or failure confirmed</text>
<line x1="274" y1="156" x2="328" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="301" y="144" text-anchor="middle" font-size="11" fill="#64748b">send</text>
<line x1="572" y1="156" x2="626" y2="156" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="599" y="144" text-anchor="middle" font-size="11" fill="#64748b">confirmed</text>
<text x="330" y="260" font-size="13" font-weight="600" fill="#dc2626">Do not open a second refund from UNKNOWN.</text>
<text x="32" y="304" font-size="13" fill="#64748b">Confirm with the provider; retry the same key only where the contract allows it.</text>
<text x="32" y="330" font-size="13" fill="#64748b">One key per operation. Retrying must not create another refund.</text>
</svg>
