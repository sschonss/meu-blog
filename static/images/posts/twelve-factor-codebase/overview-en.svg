<rect x="680" y="216" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="790.0" y="241.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Production</text>
