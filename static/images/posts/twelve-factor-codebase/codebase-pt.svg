<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Fator I. À esquerda, o certo: um único repositório com uma linha de versões, e cada deploy roda uma versão dele (produção na v1.4, homologação na v1.5, local na main). À direita, o problema: uma cópia do sistema por cliente, cada uma com sua própria história, e uma correção feita numa cópia não chega às outras</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="440" height="370" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="240" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Um app, uma base de código</text>
<rect x="45" y="72" width="390" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="240" y="92" text-anchor="middle" font-size="12" fill="#475569">repositório: loja</text>
<line x1="90" y1="122" x2="390" y2="122" stroke="#2563eb" stroke-width="2"/>
<circle cx="90" cy="122" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="90" y="144" text-anchor="middle" font-size="11" fill="#111827">v1.3</text>
<circle cx="190" cy="122" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="190" y="144" text-anchor="middle" font-size="11" fill="#111827">v1.4</text>
<circle cx="290" cy="122" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="290" y="144" text-anchor="middle" font-size="11" fill="#111827">v1.5</text>
<circle cx="390" cy="122" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="390" y="144" text-anchor="middle" font-size="11" fill="#111827">main</text>
<line x1="190" y1="152" x2="100" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="35" y="238" width="130" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="100.0" y="263.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Produção</text>
<text x="100.0" y="281.0" text-anchor="middle" font-size="12" fill="#475569">roda a v1.4</text>
<line x1="290" y1="152" x2="240" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="175" y="238" width="130" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="240.0" y="263.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Homologação</text>
<text x="240.0" y="281.0" text-anchor="middle" font-size="12" fill="#475569">roda a v1.5</text>
<line x1="390" y1="152" x2="380" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="315" y="238" width="130" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="380.0" y="263.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Local</text>
<text x="380.0" y="281.0" text-anchor="middle" font-size="12" fill="#475569">main + mudanças</text>
<text x="240" y="350" text-anchor="middle" font-size="13" fill="#166534">Versões diferentes, mesma história.</text>
<rect x="500" y="20" width="440" height="370" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="720" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Uma cópia por cliente</text>
<rect x="560" y="75" width="320" height="62" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="720.0" y="103.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">loja-cliente-a</text>
<text x="720.0" y="121.0" text-anchor="middle" font-size="12" fill="#475569">correção feita aqui</text>
<rect x="560" y="157" width="320" height="62" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="720.0" y="185.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">loja-cliente-b</text>
<text x="720.0" y="203.0" text-anchor="middle" font-size="12" fill="#475569">correção não chegou</text>
<rect x="560" y="239" width="320" height="62" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="720.0" y="267.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">loja-cliente-c</text>
<text x="720.0" y="285.0" text-anchor="middle" font-size="12" fill="#475569">parada numa versão de 2024</text>
<text x="720" y="350" text-anchor="middle" font-size="13" fill="#991b1b">Três histórias que só se afastam.</text>
<text x="480" y="430" text-anchor="middle" font-size="14" fill="#334155">Deploys podem rodar versões diferentes. O que não pode é existir mais de uma base para o mesmo app.</text>
</svg>