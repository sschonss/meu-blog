<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" font-family="system-ui,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="390" fill="#ffffff"/><rect x="20" y="135" width="200" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="120.0" y="174.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">same code</text><text x="120.0" y="196.0" text-anchor="middle" font-size="13" fill="#334155">one build, no passwords</text><rect x="340" y="65" width="220" height="90" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="450.0" y="104.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">dev env</text><text x="450.0" y="126.0" text-anchor="middle" font-size="13" font-family="monospace" fill="#334155">DB_HOST=localhost</text><rect x="340" y="205" width="220" height="90" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="450.0" y="244.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">prod env</text><text x="450.0" y="266.0" text-anchor="middle" font-size="13" font-family="monospace" fill="#334155">DB_HOST=db.prod.internal</text><rect x="680" y="65" width="200" height="90" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="780.0" y="104.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">dev deploy</text><text x="780.0" y="126.0" text-anchor="middle" font-size="13" fill="#334155">local database, debug log</text><rect x="680" y="205" width="200" height="90" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="780.0" y="244.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">production deploy</text><text x="780.0" y="266.0" text-anchor="middle" font-size="13" fill="#334155">production database, info log</text><line x1="220" y1="170" x2="334" y2="118" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><line x1="220" y1="190" x2="334" y2="242" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><line x1="560" y1="110" x2="674" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><line x1="560" y1="250" x2="674" y2="250" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="340" text-anchor="middle" font-size="14" fill="#334155">The code goes to Git. The values live in the environment of each deploy</text><text x="450" y="363" text-anchor="middle" font-size="14" fill="#334155">and never in the repository.</text><text x="20" y="40" font-size="15" font-weight="700" fill="#0f172a">One build, many deploys</text></svg>