<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Fluxo do Web Push: a página se inscreve no push service com a chave pública VAPID, manda a inscrição ao servidor; o servidor faz POST no endpoint com JWT VAPID e corpo cifrado; o push service responde 201 ou 410 e acorda o service worker, que mostra a notificação</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<rect x="20" y="20" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="120.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Página</text>
<text x="120.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">no navegador</text>
<line x1="120" y1="78" x2="120" y2="500" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="270" y="20" width="200" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="370.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Push service</text>
<text x="370.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">FCM no Chrome</text>
<line x1="370" y1="78" x2="370" y2="500" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="520" y="20" width="200" height="56" rx="8" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<text x="620.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Servidor do lab</text>
<text x="620.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">Node.js + web-push</text>
<line x1="620" y1="78" x2="620" y2="500" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="750" y="20" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="850.0" y="43.5" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Service worker</text>
<text x="850.0" y="61.5" text-anchor="middle" font-size="12" fill="#475569">no navegador, fora da aba</text>
<line x1="850" y1="78" x2="850" y2="500" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="124" y1="120" x2="366" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="134" y="96" width="222" height="18" fill="#ffffff"/>
<text x="245.0" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">1 · pushManager.subscribe(chave pública VAPID)</text>
<line x1="366" y1="170" x2="124" y2="170" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="134" y="146" width="222" height="18" fill="#ffffff"/>
<text x="245.0" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">2 · endpoint + p256dh + auth</text>
<line x1="124" y1="220" x2="616" y2="220" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="134" y="196" width="472" height="18" fill="#ffffff"/>
<text x="370.0" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">3 · POST /subscribe (guarda a inscrição)</text>
<rect x="20" y="244" width="920" height="26" rx="6" fill="#f8fafc"/>
<text x="480" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">a aba pode fechar aqui</text>
<line x1="616" y1="320" x2="374" y2="320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="384" y="296" width="222" height="18" fill="#ffffff"/>
<text x="495.0" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">4 · POST no endpoint: Authorization: vapid t=JWT, k=chave · aes128gcm · TTL</text>
<line x1="374" y1="370" x2="616" y2="370" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<rect x="384" y="346" width="222" height="18" fill="#ffffff"/>
<text x="495.0" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">5 · 201 Created (ou 410: o servidor apaga a inscrição)</text>
<line x1="374" y1="420" x2="846" y2="420" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="384" y="396" width="452" height="18" fill="#ffffff"/>
<text x="610.0" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">6 · entrega: o navegador acorda o service worker</text>
<path d="M854,450 h40 v30 h-36" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="840" y="470" text-anchor="end" font-size="12" font-weight="600" fill="#111827">7 · showNotification()</text>
</svg>