<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><rect x="20" y="90" width="200" height="90" rx="10" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/><text x="120.0" y="129.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">composer.json</text><text x="120.0" y="151.0" text-anchor="middle" font-size="13" fill="#334155">o que o app aceita: ^4.0</text><line x1="220" y1="135" x2="334" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="280.0" y="123" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">composer update</text><rect x="340" y="90" width="200" height="90" rx="10" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/><text x="440.0" y="129.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">composer.lock</text><text x="440.0" y="151.0" text-anchor="middle" font-size="13" fill="#334155">a versão exata: 4.10.0</text><line x1="540" y1="135" x2="674" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/><text x="610.0" y="123" text-anchor="middle" font-family="monospace" font-size="13" fill="#2563eb">composer install</text><rect x="680" y="90" width="200" height="90" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/><text x="780.0" y="129.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">vendor/</text><text x="780.0" y="151.0" text-anchor="middle" font-size="13" fill="#334155">o código baixado</text><text x="440" y="235" text-anchor="middle" font-size="14" fill="#334155">O composer.json e o composer.lock vão para o Git. A pasta vendor/ não:</text><text x="440" y="258" text-anchor="middle" font-size="14" fill="#334155">ela é recriada em cada máquina a partir do lock.</text><text x="20" y="45" font-size="15" font-weight="700" fill="#0f172a">Do pedido à instalação</text></svg>