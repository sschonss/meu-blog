name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Refresh Sessionize data
        # Fetched at build time so the workflow never needs to push to main.
        # Falls back to the committed data/sessionize.json if Sessionize is down.
        run: python3 scripts/sync_sessionize.py || echo "Sessionize sync failed; using committed data"
      - name: Most read articles from Umami
        # Public, read-only share link; no secret needed. If Umami is down the
        # home page just hides the "Most read" block.
        run: python3 scripts/sync_umami.py || echo "Umami sync failed; skipping most read"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build favicons and backup photo from Sessionize
        # Falls back to the files committed in static/ if this fails.
        run: |
          pip install --quiet pillow
          python3 scripts/build_favicons.py || echo "Favicon build failed; using committed icons"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
