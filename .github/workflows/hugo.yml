name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every day at 07:17 in Brasília (10:17 UTC): refreshes Sessionize data and
    # publishes articles scheduled for today (a future `date` in the front matter).
    - cron: '17 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Refresh Sessionize data
        # Fetched at build time so the workflow never needs to push to main.
        # Falls back to the committed data/sessionize.json if Sessionize is down.
        run: python3 scripts/sync_sessionize.py || echo "Sessionize sync failed; using committed data"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build favicons and backup photo from Sessionize
        # Falls back to the files committed in static/ if this fails.
        run: |
          pip install --quiet pillow
          python3 scripts/build_favicons.py || echo "Favicon build failed; using committed icons"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Newsletter for new articles
        # After the site is live: creates a Buttondown email for articles
        # published in the last 2 days (never twice for the same article).
        # NEWSLETTER_MODE: "draft" waits for review in Buttondown; "send" sends it.
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_MODE: send
        run: python3 scripts/send_newsletter.py || echo "Newsletter step failed; the site is already published"
