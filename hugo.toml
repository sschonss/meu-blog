baseURL = 'https://sschonss.github.io/meu-blog/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Luiz Schons'
theme = 'hextra'
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params.navbar]
  displayTitle = true
  displayLogo = false

[params.footer]
  displayCopyright = true
  displayPoweredBy = false

[params.search]
  enable = true
  type = 'flexsearch'

[params.search.flexsearch]
  index = 'content'
  tokenize = 'forward'

[languages]
  [languages.en]
    languageName = 'English'
    languageCode = 'en-us'
    weight = 1
    contentDir = 'content'
    [languages.en.params]
      description = 'Senior Software Engineer @ PicPay. Writing about software engineering, architecture and AI.'
  [languages."pt-br"]
    languageName = 'Português'
    languageCode = 'pt-br'
    weight = 2
    contentDir = 'content'
    [languages."pt-br".params]
      description = 'Senior Software Engineer @ PicPay. Escrevendo sobre engenharia de software, arquitetura e IA.'

[[languages.en.menu.main]]
  name = 'Articles'
  pageRef = '/posts'
  weight = 1
[[languages.en.menu.main]]
  name = 'Talks'
  pageRef = '/speakers'
  weight = 2
[[languages.en.menu.main]]
  name = 'Contact'
  pageRef = '/contact'
  weight = 3
[[languages.en.menu.main]]
  name = 'Search'
  weight = 4
  [languages.en.menu.main.params]
    type = 'search'
    icon = 'search'
[[languages.en.menu.main]]
  name = 'Language'
  weight = 5
  [languages.en.menu.main.params]
    type = 'language-switch'
    icon = 'translate'

[[languages."pt-br".menu.main]]
  name = 'Artigos'
  pageRef = '/posts'
  weight = 1
[[languages."pt-br".menu.main]]
  name = 'Palestras'
  pageRef = '/speakers'
  weight = 2
[[languages."pt-br".menu.main]]
  name = 'Contato'
  pageRef = '/contact'
  weight = 3
[[languages."pt-br".menu.main]]
  name = 'Buscar'
  weight = 4
  [languages."pt-br".menu.main.params]
    type = 'search'
    icon = 'search'
[[languages."pt-br".menu.main]]
  name = 'Idioma'
  weight = 5
  [languages."pt-br".menu.main.params]
    type = 'language-switch'
    icon = 'translate'

[taxonomies]
  series = 'series'
