baseURL = 'https://luizschons.com/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Luiz Schons'
theme = 'hextra'
enableRobotsTXT = true
titleCaseStyle = 'none'
# Dates without a time (date: 2026-10-20) mean midnight in Brasília. Articles with
# a future date are left out of the build until that day; the daily deploy
# (.github/workflows/hugo.yml) then publishes them on their own.
timeZone = 'America/Sao_Paulo'
buildFuture = false

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params.navbar]
  displayTitle = true
  displayLogo = false

[params.footer]
  displayCopyright = false
  displayPoweredBy = false

[params.theme]
  default = 'light'
  displayToggle = false

[params.search]
  enable = true
  type = 'flexsearch'

[params.search.flexsearch]
  index = 'content'
  tokenize = 'forward'

[languages]
  [languages.en]
    languageName = 'English'
    languageCode = 'en-us'
    weight = 1
    contentDir = 'content'
    [languages.en.params]
      description = 'Senior Software Engineer @ PicPay. Writing about software engineering, architecture and AI.'
  [languages."pt-br"]
    languageName = 'Português'
    languageCode = 'pt-br'
    weight = 2
    contentDir = 'content'
    [languages."pt-br".params]
      description = 'Senior Software Engineer @ PicPay. Escrevendo sobre engenharia de software, arquitetura e IA.'

[[languages.en.menu.main]]
  name = 'Articles'
  pageRef = '/posts'
  weight = 1
[[languages.en.menu.main]]
  name = 'Talks'
  pageRef = '/speakers'
  weight = 2
[[languages.en.menu.main]]
  name = 'Contact'
  pageRef = '/contact'
  weight = 3
[[languages.en.menu.main]]
  name = 'Search'
  weight = 4
  [languages.en.menu.main.params]
    type = 'search'
    icon = 'search'
[[languages.en.menu.main]]
  name = 'Language'
  weight = 5
  [languages.en.menu.main.params]
    type = 'language-switch'
    icon = 'translate'

[[languages."pt-br".menu.main]]
  name = 'Artigos'
  pageRef = '/posts'
  weight = 1
[[languages."pt-br".menu.main]]
  name = 'Palestras'
  pageRef = '/speakers'
  weight = 2
[[languages."pt-br".menu.main]]
  name = 'Contato'
  pageRef = '/contact'
  weight = 3
[[languages."pt-br".menu.main]]
  name = 'Buscar'
  weight = 4
  [languages."pt-br".menu.main.params]
    type = 'search'
    icon = 'search'
[[languages."pt-br".menu.main]]
  name = 'Idioma'
  weight = 5
  [languages."pt-br".menu.main.params]
    type = 'language-switch'
    icon = 'translate'

[outputs]
  home = ['html', 'rss', 'llms']
  page = ['html', 'markdown']
  section = ['html', 'rss']

[taxonomies]
  series = 'series'
  tag = 'tags'

[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'series'
    weight = 60
  [[related.indices]]
    name = 'date'
    weight = 5

# Comments (giscus): stored as GitHub Discussions in this repository.
# The block only renders once categoryId is filled in.
[params.giscus]
  repo = 'sschonss/meu-blog'
  repoId = 'R_kgDOU3qW3A'
  category = 'Announcements'
  categoryId = 'DIC_kwDOU3qW3M4DHVRu'

# Newsletter (Buttondown). The subscribe form only needs the username; the
# deploy sends new articles with the BUTTONDOWN_API_KEY repository secret
# (scripts/send_newsletter.py).
[params.newsletter]
  username = 'schons'
